<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Tester Job ⭐</title>
<style>
  :root {
    --pink: #ff6fa5;
    --purple: #8a5cff;
    --blue: #3fb6ff;
    --green: #46d68a;
    --yellow: #ffd23f;
    --ink: #33235b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo", system-ui, sans-serif;
    background: linear-gradient(160deg, #fff0f7 0%, #eef4ff 60%, #eafff4 100%);
    color: var(--ink);
    min-height: 100vh;
    padding: 16px;
    text-align: center;
  }
  header h1 { font-size: clamp(28px, 7vw, 48px); margin: 8px 0 0; }
  header p  { font-size: clamp(16px, 4vw, 22px); margin: 4px 0 16px; opacity: .8; }

  .card {
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 10px 0 rgba(138,92,255,.18), 0 18px 40px rgba(51,35,91,.15);
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 20px 28px;
  }

  .mascot { font-size: clamp(56px, 16vw, 96px); line-height: 1; margin: 4px 0; }

  .question {
    font-size: clamp(22px, 6vw, 34px);
    font-weight: 800;
    margin: 8px 12px 18px;
    line-height: 1.25;
  }

  .btn {
    border: none;
    border-radius: 22px;
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    padding: 20px 18px;
    font-size: clamp(20px, 5.5vw, 28px);
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
    transition: transform .08s, box-shadow .08s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }

  .choices { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; margin-top: 8px; }
  .choices.single { grid-template-columns: 1fr; }

  .btn-yes  { background: linear-gradient(var(--green), #35b673); }
  .btn-no   { background: linear-gradient(#ff9ab5, #ff6fa5); }
  .btn-blue { background: linear-gradient(var(--blue), #1f97e6); }
  .btn-purple { background: linear-gradient(var(--purple), #6f42e6); }
  .btn-gray { background: linear-gradient(#c7c0e0, #a99fd0); }

  .speak {
    background: var(--yellow);
    color: var(--ink);
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(16px, 4.4vw, 22px);
    padding: 12px 20px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.12);
    margin-bottom: 14px;
  }
  .speak:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }

  /* Feeling faces */
  .faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 6px; }
  .face {
    font-size: clamp(34px, 10vw, 52px);
    background: #f4f0ff;
    border: 4px solid transparent;
    border-radius: 20px;
    padding: 10px 0;
    cursor: pointer;
    transition: transform .08s;
  }
  .face:active { transform: scale(.92); }
  .face.picked { border-color: var(--purple); background: #efe7ff; }

  /* Stars */
  .stars { font-size: clamp(40px, 12vw, 64px); letter-spacing: 6px; user-select: none; }
  .star { cursor: pointer; filter: grayscale(1) opacity(.4); transition: transform .1s; }
  .star.on { filter: none; }
  .star:active { transform: scale(1.2); }

  /* Progress dots */
  .dots { display: flex; gap: 8px; justify-content: center; margin: 14px 0 4px; flex-wrap: wrap; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #ddd6f2; }
  .dot.done { background: var(--green); }
  .dot.current { background: var(--purple); transform: scale(1.3); }

  .back {
    background: none; border: none; color: var(--ink); opacity:.55;
    font-family: inherit; font-size: 18px; cursor: pointer; margin-top: 18px;
  }

  /* Sticker reward burst */
  #burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti { position: absolute; font-size: 28px; animation: fall 1.6s linear forwards; }
  @keyframes fall {
    from { transform: translateY(-40px) rotate(0); opacity: 1; }
    to   { transform: translateY(105vh) rotate(540deg); opacity: 1; }
  }

  /* Summary screen */
  .report { text-align: left; font-size: clamp(17px, 4.5vw, 21px); line-height: 1.5; }
  .report li { margin: 10px 0; list-style: none; }
  .report .q { font-weight: 800; }
  ul.report { padding-left: 0; }

  /* Memory note input */
  .notebox {
    width: 100%;
    font-family: inherit;
    font-size: clamp(20px, 5.5vw, 28px);
    text-align: center;
    padding: 16px 14px;
    border: 4px solid var(--purple);
    border-radius: 20px;
    color: var(--ink);
    outline: none;
    margin-top: 6px;
  }
  .notebox::placeholder { color: #b7add6; }
  .hint { font-size: clamp(15px, 4vw, 19px); opacity: .7; margin: 4px 12px 10px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="burst"></div>

  <header>
    <h1>My Tester Job ⭐</h1>
    <p id="subtitle">You are testing Helio Math!</p>
  </header>

  <div class="card" id="card">
    <!-- filled by JavaScript -->
  </div>

  <script>
  // ---- The questions your daughter answers ----
  // type: "yesno"  -> Yes / No big buttons
  //       "faces"  -> 5 feeling faces (sad -> happy)
  //       "stars"  -> 1 to 5 stars
  const QUESTIONS = [
    { id: "bug",     icon: "🐞", text: "Did you find any bugs today?",              type: "yesno" },
    { id: "improve", icon: "🛠️", text: "Did you find something that could be better?", type: "yesno" },
    { id: "stuck",   icon: "😵", text: "Did you get stuck on anything today?",       type: "yesno" },
    { id: "learn",   icon: "🧠", text: "Did you learn anything new today?",          type: "yesno" },
    { id: "fun",     icon: "😀", text: "How did the app make you feel?",             type: "faces" },
    { id: "hard",    icon: "🧗", text: "Was the math too easy or too hard?",         type: "faces",
      faceIcons:  ["☁️","🌤️","🏞️","⛰️","🏔️"],
      faceLabels: ["Way too easy","A little easy","Just right","A little hard","Way too hard"] },
    { id: "stars",   icon: "🌟", text: "How many stars for the app today?",          type: "stars" },
  ];

  const FACE_EMOJI = ["😞","🙁","😐","🙂","😍"];

  const answers = {};
  const notes = {};
  let step = 0;

  const REVIEWER = "Avery";

  const card = document.getElementById("card");

  function speak(text) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.92; u.pitch = 1.15;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function confetti() {
    const burst = document.getElementById("burst");
    const emojis = ["⭐","🎉","💖","🌈","✨","🦄","🍩"];
    for (let i = 0; i < 24; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.textContent = emojis[i % emojis.length];
      c.style.left = (5 + Math.random() * 90) + "%";
      c.style.animationDelay = (Math.random() * 0.4) + "s";
      c.style.fontSize = (22 + Math.random() * 22) + "px";
      burst.appendChild(c);
      setTimeout(() => c.remove(), 2100);
    }
  }

  function dotsHtml() {
    let h = '<div class="dots">';
    for (let i = 0; i < QUESTIONS.length; i++) {
      let cls = "dot";
      if (i < step) cls += " done";
      if (i === step) cls += " current";
      h += `<div class="${cls}"></div>`;
    }
    h += '</div>';
    return h;
  }

  function render() {
    if (step >= QUESTIONS.length) return renderDone();

    const q = QUESTIONS[step];
    let inner = `
      <div class="mascot">${q.icon}</div>
      <button class="speak" id="speakBtn">🔊 Read it to me</button>
      <div class="question">${q.text}</div>
    `;

    if (q.type === "yesno") {
      inner += `
        <div class="choices">
          <button class="btn btn-yes" data-val="yes">👍 Yes</button>
          <button class="btn btn-no"  data-val="no">👎 No</button>
        </div>`;
    } else if (q.type === "faces") {
      const icons = q.faceIcons || FACE_EMOJI;
      inner += `<div class="faces">` +
        icons.map((e, i) => `<button class="face" data-val="${i+1}">${e}</button>`).join("") +
        `</div>
        <div class="choices single" style="margin-top:18px">
          <button class="btn btn-purple hidden" id="nextBtn">Next ➡️</button>
        </div>`;
    } else if (q.type === "stars") {
      inner += `<div class="stars" id="stars">` +
        [1,2,3,4,5].map(i => `<span class="star" data-val="${i}">⭐</span>`).join("") +
        `</div>
        <div class="choices single" style="margin-top:18px">
          <button class="btn btn-purple hidden" id="nextBtn">Next ➡️</button>
        </div>`;
    }

    if (step > 0) inner += `<button class="back" id="backBtn">⬅️ Go back</button>`;
    inner += dotsHtml();

    card.innerHTML = inner;
    wire(q);
    speak(q.text);
  }

  function wire(q) {
    document.getElementById("speakBtn").onclick = () => speak(q.text);
    const backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.onclick = () => { step = Math.max(0, step - 1); render(); };

    if (q.type === "yesno") {
      card.querySelectorAll(".btn[data-val]").forEach(b => {
        b.onclick = () => { answers[q.id] = b.dataset.val; advance(); };
      });
    } else if (q.type === "faces") {
      const nextBtn = document.getElementById("nextBtn");
      card.querySelectorAll(".face").forEach(f => {
        f.onclick = () => {
          card.querySelectorAll(".face").forEach(x => x.classList.remove("picked"));
          f.classList.add("picked");
          answers[q.id] = Number(f.dataset.val);
          nextBtn.classList.remove("hidden");
        };
      });
      nextBtn.onclick = advance;
    } else if (q.type === "stars") {
      const stars = card.querySelectorAll(".star");
      const nextBtn = document.getElementById("nextBtn");
      stars.forEach(s => {
        s.onclick = () => {
          const val = Number(s.dataset.val);
          answers[q.id] = val;
          stars.forEach(x => x.classList.toggle("on", Number(x.dataset.val) <= val));
          nextBtn.classList.remove("hidden");
        };
      });
      nextBtn.onclick = advance;
    }
  }

  function advance() {
    confetti();
    renderNote();
  }

  function renderNote() {
    const q = QUESTIONS[step];
    const prompt = "Type one or two words to help you remember what you saw. Your boss might ask you about it!";
    card.innerHTML = `
      <div class="mascot">📝</div>
      <button class="speak" id="speakBtn">🔊 Read it to me</button>
      <div class="question">One or two words to remember</div>
      <p class="hint">${prompt}</p>
      <input class="notebox" id="noteInput" type="text" autocomplete="off"
             placeholder="like: added wrong" value="${(notes[q.id] || "").replace(/"/g,'&quot;')}" />
      <div class="choices single" style="margin-top:18px">
        <button class="btn btn-purple" id="noteNext">Next ➡️</button>
        <button class="btn btn-gray" id="noteSkip">Skip ⏭️</button>
      </div>
      ${dotsHtml()}
    `;
    const input = document.getElementById("noteInput");
    document.getElementById("speakBtn").onclick = () => speak(prompt);
    const go = (save) => {
      notes[q.id] = save ? input.value.trim() : "";
      confetti();
      step++;
      render();
    };
    document.getElementById("noteNext").onclick = () => go(true);
    document.getElementById("noteSkip").onclick = () => go(false);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(true); });
    input.focus();
    speak(prompt);
  }

  function renderDone() {
    window.speechSynthesis && window.speechSynthesis.cancel();
    confetti();
    const dateStr = new Date().toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });

    const rows = QUESTIONS.map(q => {
      let a = answers[q.id];
      let shown;
      if (q.type === "yesno") shown = a === "yes" ? "👍 Yes" : a === "no" ? "👎 No" : "—";
      else if (q.type === "faces") shown = a ? `${(q.faceIcons || FACE_EMOJI)[a-1]} ${(q.faceLabels ? q.faceLabels[a-1] : "")}` : "—";
      else if (q.type === "stars") shown = a ? "⭐".repeat(a) : "—";
      const note = (notes[q.id] || "").trim();
      const noteHtml = note ? `<br><span style="opacity:.7">📝 ${note}</span>` : "";
      return `<li><span class="q">${q.icon} ${q.text}</span><br>${shown}${noteHtml}</li>`;
    }).join("");

    card.innerHTML = `
      <div class="mascot">🏆</div>
      <div class="question">Great job today, ${REVIEWER}!</div>
      <p style="opacity:.7;margin-top:-6px">${dateStr}</p>
      <ul class="report">${rows}</ul>
      <div class="choices single" style="margin-top:8px">
        <button class="btn btn-blue" id="printBtn">🖨️ Show Boss my report</button>
        <button class="btn btn-purple" id="againBtn">🔁 Do it again tomorrow</button>
      </div>
    `;
    document.getElementById("printBtn").onclick = () => window.print();
    document.getElementById("againBtn").onclick = () => {
      for (const k in answers) delete answers[k];
      for (const k in notes) delete notes[k];
      step = 0; render();
    };
  }

  render();
  </script>
</body>
</html>
